<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>馬Sir圖解 · 圓形角</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"
  onload="window.__katexReady && window.__katexReady()"></script>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --ink: #1a2332;
    --muted: #5a6577;
    --faint: #8b95a8;
    --line: #e2e8f0;
    --blue: #2563eb;
    --blue-soft: #dbeafe;
    --blue-mid: #93c5fd;
    --rose: #e11d48;
    --rose-soft: #ffe4e6;
    --yellow: #f59e0b;
    --yellow-soft: #fef3c7;
    --purple: #7c3aed;
    --purple-soft: #ede9fe;
    --green: #059669;
    --green-soft: #d1fae5;
    --gray-soft: #f1f5f9;
    --shadow: 0 1px 3px rgba(26,35,50,.06), 0 8px 24px rgba(26,35,50,.06);
    --radius: 14px;
    --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
  body { min-height: 100vh; display: flex; flex-direction: column; }
  .app {
    max-width: 1180px; margin: 0 auto; padding: 16px 18px 28px;
    flex: 1; width: 100%; display: flex; flex-direction: column; gap: 14px;
  }
  header.top {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 16px; box-shadow: var(--shadow);
  }
  .brand { font-weight: 700; font-size: 1.05rem; letter-spacing: .02em; white-space: nowrap; }
  .brand span { color: var(--blue); }
  .step-meta { color: var(--muted); font-size: .9rem; white-space: nowrap; }
  .nav-row { display: flex; align-items: center; gap: 8px; flex: 1; flex-wrap: wrap; justify-content: flex-end; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .pill {
    width: 32px; height: 32px; border-radius: 999px; border: 1.5px solid var(--line);
    background: #fff; color: var(--muted); font-weight: 600; font-size: .85rem;
    cursor: pointer; transition: .15s ease;
  }
  .pill:hover { border-color: var(--blue-mid); color: var(--blue); }
  .pill.active { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 4px 12px rgba(37,99,235,.35); }
  .pill.done { background: var(--blue-soft); border-color: var(--blue-mid); color: var(--blue); }
  .btn {
    appearance: none; border: 1.5px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: .9rem;
    cursor: pointer; transition: .15s ease; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover:not(:disabled) { border-color: var(--blue-mid); color: var(--blue); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 4px 14px rgba(37,99,235,.28); }
  .btn.primary:hover:not(:disabled) { background: #1d4ed8; color: #fff; }
  .main {
    display: grid; grid-template-columns: minmax(280px, 40%) minmax(320px, 1fr); gap: 14px;
    flex: 1; min-height: 0;
  }
  @media (max-width: 900px) {
    .main { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 20px 22px; overflow: auto;
  }
  .panel h2 { margin: 0 0 12px; font-size: 1.35rem; line-height: 1.3; }
  .lesson { font-size: .98rem; line-height: 1.7; color: var(--ink); }
  .lesson p { margin: 0 0 12px; }
  .lesson ul { margin: 0 0 12px; padding-left: 1.2em; }
  .lesson li { margin: 4px 0; }
  .tip {
    border-radius: 12px; padding: 12px 14px; margin: 12px 0; border: 1px solid transparent;
  }
  .tip.yellow { background: var(--yellow-soft); border-color: #fde68a; }
  .tip.purple { background: var(--purple-soft); border-color: #ddd6fe; }
  .tip.green { background: var(--green-soft); border-color: #a7f3d0; }
  .tip.gray { background: var(--gray-soft); border-color: var(--line); }
  .tip .label {
    display: inline-flex; align-items: center; gap: 6px;
    font-weight: 700; font-size: .82rem; margin-bottom: 6px; letter-spacing: .02em;
  }
  .chip {
    display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: middle;
  }
  .chip.y { background: var(--yellow); }
  .chip.p { background: var(--purple); }
  .chip.g { background: var(--green); }
  .chip.gr { background: #94a3b8; }
  .legend-row {
    display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 8px; font-size: .8rem; color: var(--muted);
  }
  .diagram-wrap { display: flex; flex-direction: column; gap: 10px; }
  .diagram-card {
    background: #fafbfc; border: 1px solid var(--line); border-radius: 12px;
    padding: 8px; position: relative; min-height: 420px;
    display: flex; align-items: center; justify-content: center;
  }
  svg.fig { width: 100%; max-width: 520px; height: auto; touch-action: manipulation; }
  .caption { font-size: .85rem; color: var(--muted); line-height: 1.55; padding: 0 4px; }
  footer.foot {
    text-align: center; color: var(--faint); font-size: .8rem; padding: 4px 0 8px;
  }
  /* SVG helpers */
  .hide { display: none !important; }
  .dim { opacity: .28; }
  text.lbl { font-family: var(--font); font-size: 15px; font-weight: 700; fill: var(--ink); }
  text.ang { font-family: var(--font); font-size: 13px; font-weight: 700; }
  text.ang.given { fill: var(--blue); }
  text.ang.derived { fill: #0f766e; }
  text.ang.target { fill: var(--rose); }
  .katex { font-size: 1.05em; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">馬Sir圖解 · <span>圓形角</span></div>
    <div class="step-meta" id="stepMeta">步驟 1／12</div>
    <div class="nav-row">
      <button class="btn" id="btnPrev" type="button" aria-label="上一步">← 上一步</button>
      <div class="pills" id="pills" role="tablist" aria-label="步驟"></div>
      <button class="btn primary" id="btnNext" type="button" aria-label="下一步">下一步 →</button>
    </div>
  </header>

  <div class="main">
    <section class="panel" id="lessonPanel" aria-live="polite">
      <h2 id="lessonTitle"></h2>
      <div class="lesson" id="lessonBody"></div>
      <div class="legend-row">
        <span><i class="chip y"></i> 黃＝專有名詞</span>
        <span><i class="chip p"></i> 紫＝為甚麼</span>
        <span><i class="chip g"></i> 綠＝小結</span>
        <span><i class="chip gr"></i> 灰＝公式</span>
      </div>
    </section>

    <section class="panel diagram-wrap">
      <div class="diagram-card">
        <svg class="fig" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" aria-label="圓內接四邊形 ABCD 圖">
          <defs>
            <marker id="dot" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="3" markerHeight="3">
              <circle cx="3" cy="3" r="3" fill="#1a2332"/>
            </marker>
          </defs>
          <!-- circle -->
          <circle id="circ" cx="200" cy="200" r="155" fill="#fff" stroke="#334155" stroke-width="2"/>

          <!-- shaded regions (toggled) -->
          <path id="shadeABD" class="hide" d="M200,45 L65.77,277.5 L334.23,277.5 Z" fill="#93c5fd" fill-opacity="0.35" stroke="none"/>
          <path id="shadeBCD" class="hide" d="M65.77,277.5 L213.51,354.41 L334.23,277.5 Z" fill="#fb7185" fill-opacity="0.28" stroke="none"/>
          <path id="shadeBCE" class="hide" d="M65.77,277.5 L213.51,354.41 L206.24,188.01 Z" fill="#c4b5fd" fill-opacity="0.4" stroke="none"/>
          <path id="shadeSegAB" class="hide" d="M200,45 A155,155 0 0,0 65.77,277.5 L200,45 Z" fill="#fde68a" fill-opacity="0.45" stroke="none"/>

          <!-- base skeleton -->
          <g id="gSkeleton" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line id="AB" x1="200" y1="45" x2="65.77" y2="277.5"/>
            <line id="AD" x1="200" y1="45" x2="334.23" y2="277.5"/>
            <line id="BC" x1="65.77" y1="277.5" x2="213.51" y2="354.41"/>
            <line id="CD" x1="213.51" y1="354.41" x2="334.23" y2="277.5"/>
            <line id="AC" x1="200" y1="45" x2="213.51" y2="354.41"/>
            <line id="BD" x1="65.77" y1="277.5" x2="334.23" y2="277.5"/>
            <line id="BE" x1="65.77" y1="277.5" x2="206.24" y2="188.01"/>
          </g>

          <!-- highlight overlays -->
          <g id="hl" stroke-linecap="round" fill="none">
            <line id="hlAB" class="hide" x1="200" y1="45" x2="65.77" y2="277.5" stroke="#2563eb" stroke-width="4"/>
            <line id="hlAD" class="hide" x1="200" y1="45" x2="334.23" y2="277.5" stroke="#2563eb" stroke-width="4"/>
            <line id="hlBC" class="hide" x1="65.77" y1="277.5" x2="213.51" y2="354.41" stroke="#2563eb" stroke-width="4"/>
            <line id="hlCE" class="hide" x1="213.51" y1="354.41" x2="206.24" y2="188.01" stroke="#2563eb" stroke-width="4"/>
            <line id="hlAB_orange" class="hide" x1="200" y1="45" x2="65.77" y2="277.5" stroke="#f97316" stroke-width="4.5"/>
            <line id="hlBD" class="hide" x1="65.77" y1="277.5" x2="334.23" y2="277.5" stroke="#2563eb" stroke-width="3.5"/>
            <line id="hlBE" class="hide" x1="65.77" y1="277.5" x2="206.24" y2="188.01" stroke="#e11d48" stroke-width="3.5"/>
          </g>

          <!-- tick marks AB=AD -->
          <g id="ticksABAD" stroke="#2563eb" stroke-width="2.2">
            <line x1="128" y1="148" x2="140" y2="160"/>
            <line x1="272" y1="148" x2="260" y2="160"/>
          </g>
          <!-- tick marks BC=CE (double) -->
          <g id="ticksBCCE" stroke="#2563eb" stroke-width="2">
            <line x1="132" y1="310" x2="144" y2="322"/>
            <line x1="126" y1="316" x2="138" y2="328"/>
            <line x1="204" y1="268" x2="216" y2="272"/>
            <line x1="202" y1="276" x2="214" y2="280"/>
          </g>

          <!-- angle arcs -->
          <g id="arcs" fill="none" stroke-width="2.5">
            <!-- ∠ADB = 58 given at D -->
            <path id="arcADB" d="M304,277.5 A30,30 0 0,1 318,252" stroke="#2563eb"/>
            <!-- ∠CBD = 25 given at B -->
            <path id="arcCBD" d="M95,277.5 A28,28 0 0,1 88,300" stroke="#2563eb"/>
            <!-- ∠ABD = 58 -->
            <path id="arcABD" class="hide" d="M95,277.5 A32,32 0 0,0 108,248" stroke="#0f766e"/>
            <!-- ∠BAD = 64 at A -->
            <path id="arcBAD" class="hide" d="M178,72 A34,34 0 0,1 222,72" stroke="#0f766e"/>
            <!-- ∠BCD = 116 at C -->
            <path id="arcBCD" class="hide" d="M188,340 A28,28 0 0,1 238,338" stroke="#0f766e"/>
            <!-- ∠BDC = 39 target at D -->
            <path id="arcBDC" class="hide" d="M304,277.5 A26,26 0 0,0 312,300" stroke="#e11d48"/>
            <!-- ∠ACB = 58 -->
            <path id="arcACB" class="hide" d="M200,340 A26,26 0 0,1 188,330" stroke="#2563eb"/>
            <!-- ∠CBE = 61 -->
            <path id="arcCBE" class="hide" d="M88,300 A30,30 0 0,1 105,255" stroke="#0f766e"/>
            <!-- ∠CEB = 61 -->
            <path id="arcCEB" class="hide" d="M200,205 A22,22 0 0,1 218,210" stroke="#0f766e"/>
            <!-- ∠ABC = 83 -->
            <path id="arcABC" class="hide" d="M108,248 A36,36 0 0,1 88,300" stroke="#0f766e"/>
            <!-- ∠ABE = 22 target -->
            <path id="arcABE" class="hide" d="M108,248 A28,28 0 0,1 118,260" stroke="#e11d48"/>
          </g>

          <!-- angle labels -->
          <g id="angLabels">
            <text id="labADB" class="ang given" x="318" y="262">58°</text>
            <text id="labCBD" class="ang given" x="72" y="312">25°</text>
            <text id="labABD" class="ang derived hide" x="108" y="252">58°</text>
            <text id="labBAD" class="ang derived hide" x="188" y="88">64°</text>
            <text id="labBCD" class="ang derived hide" x="198" y="332">116°</text>
            <text id="labBDC" class="ang target hide" x="318" y="308">39°</text>
            <text id="labACB" class="ang given hide" x="168" y="328">58°</text>
            <text id="labCBE" class="ang derived hide" x="98" y="268">61°</text>
            <text id="labCEB" class="ang derived hide" x="214" y="198">61°</text>
            <text id="labABC" class="ang derived hide" x="48" y="268">83°</text>
            <text id="labABE" class="ang target hide" x="118" y="238">22°</text>
          </g>

          <!-- points -->
          <g id="pts" fill="#1a2332">
            <circle cx="200" cy="45" r="4.5"/>
            <circle cx="65.77" cy="277.5" r="4.5"/>
            <circle cx="213.51" cy="354.41" r="4.5"/>
            <circle cx="334.23" cy="277.5" r="4.5"/>
            <circle cx="206.24" cy="188.01" r="4.5"/>
          </g>
          <text class="lbl" x="192" y="32">A</text>
          <text class="lbl" x="42" y="286">B</text>
          <text class="lbl" x="208" y="378">C</text>
          <text class="lbl" x="346" y="286">D</text>
          <text class="lbl" x="214" y="182">E</text>
        </svg>
      </div>
      <p class="caption" id="figCaption"></p>
    </section>
  </div>

  <footer class="foot">馬Sir教室 · 逐步圖解 · 唔收集學生資料</footer>
</div>

<script>
(function () {
  const TOTAL = 12;
  let step = 1;

  const steps = [
    null,
    {
      title: "先看懂題目",
      caption: "藍色＝題目給定；玫瑰紅小弧＝要求嘅兩個角 ∠BDC、∠ABE。",
      html: `
        <p>先唔急計數——對齊圖同已知條件。</p>
        <div class="tip yellow">
          <div class="label"><i class="chip y"></i>專有名詞：角嘅寫法</div>
          <div>\\(\\angle ADB\\) 表示頂點喺 <strong>D</strong>、兩邊沿 DA、DB 嘅角。</div>
        </div>
        <p><strong>已知</strong></p>
        <ul>
          <li>ABCD 係<strong>圓內接四邊形</strong>（四點喺圓上）</li>
          <li>E 喺 AC 上，且 \\(BC = CE\\)</li>
          <li>\\(AB = AD\\)</li>
          <li>\\(\\angle ADB = 58^\\circ\\)（藍）</li>
          <li>\\(\\angle CBD = 25^\\circ\\)（藍）</li>
        </ul>
        <p><strong>求</strong> \\(\\angle BDC\\) 同 \\(\\angle ABE\\)（圖中玫瑰紅標記）。</p>
      `,
      apply() {
        show(["ticksABAD","ticksBCCE","arcADB","arcCBD","labADB","labCBD","arcBDC","arcABE"]);
        // show target arcs faintly without numbers yet
        el("arcBDC").classList.remove("hide");
        el("arcABE").classList.remove("hide");
        el("labBDC").classList.add("hide");
        el("labABE").classList.add("hide");
        hl(["hlAB","hlAD","hlBC","hlCE"]);
      }
    },
    {
      title: "等腰 △ABD",
      caption: "藍色加粗：等腰兩邊 AB、AD（單劃表示相等）。",
      html: `
        <p>題目話 \\(AB = AD\\)，所以 △ABD 係<strong>等腰三角形</strong>，頂點喺 A。</p>
        <div class="tip yellow">
          <div class="label"><i class="chip y"></i>專有名詞：等腰三角形</div>
          <div>兩腰相等 ⇒ 兩底角相等。</div>
        </div>
        <div class="tip purple">
          <div class="label"><i class="chip p"></i>為甚麼</div>
          <div>喺 △ABD 入面，相等嘅兩邊係 AB、AD，所以對住佢哋嘅底角 \\(\\angle ABD\\) 同 \\(\\angle ADB\\) 必須相等。</div>
        </div>
      `,
      apply() {
        show(["shadeABD","ticksABAD","arcADB","labADB"]);
        hl(["hlAB","hlAD"]);
      }
    },
    {
      title: "求 ∠ABD＝58°",
      caption: "△ABD 兩底角相等：∠ABD＝∠ADB＝58°。",
      html: `
        <p>由等腰性質：</p>
        <div class="tip gray">
          <div class="label"><i class="chip gr"></i>公式</div>
          <div>\\(\\angle ABD = \\angle ADB = 58^\\circ\\)</div>
        </div>
        <div class="tip green">
          <div class="label"><i class="chip g"></i>小結</div>
          <div>而家知道 △ABD 有兩個 58° 嘅底角。</div>
        </div>
      `,
      apply() {
        show(["shadeABD","ticksABAD","arcADB","labADB","arcABD","labABD"]);
        hl(["hlAB","hlAD","hlBD"]);
      }
    },
    {
      title: "求 ∠BAD＝64°",
      caption: "△ABD 三隻角：58°、58°、64°。",
      html: `
        <p>求 △ABD 嘅第三隻角 \\(\\angle BAD\\)。</p>
        <div class="tip yellow">
          <div class="label"><i class="chip y"></i>專有名詞：三角形內角和</div>
          <div>任何三角形三內角之和為 \\(180^\\circ\\)。</div>
        </div>
        <div class="tip gray">
          <div class="label"><i class="chip gr"></i>公式</div>
          <div>\\(\\angle BAD + 58^\\circ + 58^\\circ = 180^\\circ\\)</div>
          <div>\\(\\angle BAD = 180^\\circ - 116^\\circ = 64^\\circ\\)</div>
        </div>
        <div class="tip green">
          <div class="label"><i class="chip g"></i>小結</div>
          <div>\\(\\angle BAD = 64^\\circ\\)。呢個角稍後會用喺圓內接四邊形。</div>
        </div>
      `,
      apply() {
        show(["shadeABD","ticksABAD","arcADB","labADB","arcABD","labABD","arcBAD","labBAD"]);
        hl(["hlAB","hlAD","hlBD"]);
      }
    },
    {
      title: "圓內接四邊形",
      caption: "ABCD 四點喺圓上 → 對角互補。",
      html: `
        <div class="tip yellow">
          <div class="label"><i class="chip y"></i>專有名詞：圓內接四邊形</div>
          <div>四個頂點都喺同一圓上嘅四邊形。重要性質：<strong>一組對角之和為 \\(180^\\circ\\)</strong>。</div>
        </div>
        <div class="tip purple">
          <div class="label"><i class="chip p"></i>為甚麼用呢度</div>
          <div>我哋已有 \\(\\angle BAD = 64^\\circ\\)，佢嘅對角就係 \\(\\angle BCD\\)。</div>
        </div>
        <div class="tip gray">
          <div class="label"><i class="chip gr"></i>公式</div>
          <div>\\(\\angle BAD + \\angle BCD = 180^\\circ\\)</div>
        </div>
      `,
      apply() {
        show(["arcBAD","labBAD"]);
        // emphasize cyclic: highlight sides of quad
        hl(["hlAB","hlAD","hlBC"]);
        el("CD").setAttribute("stroke-width","3.5");
        el("CD").setAttribute("stroke","#2563eb");
      }
    },
    {
      title: "求 ∠BCD＝116°",
      caption: "對角互補：∠BCD＝180°−64°＝116°。",
      html: `
        <div class="tip gray">
          <div class="label"><i class="chip gr"></i>公式</div>
          <div>\\(\\angle BCD = 180^\\circ - \\angle BAD = 180^\\circ - 64^\\circ = 116^\\circ\\)</div>
        </div>
        <div class="tip green">
          <div class="label"><i class="chip g"></i>小結</div>
          <div>喺 △BCD 入面，而家知道 \\(\\angle BCD = 116^\\circ\\)、\\(\\angle CBD = 25^\\circ\\)。</div>
        </div>
      `,
      apply() {
        show(["shadeBCD","arcCBD","labCBD","arcBCD","labBCD","arcBAD","labBAD"]);
        hl(["hlBD","hlBC"]);
        el("CD").setAttribute("stroke-width","3.5");
        el("CD").setAttribute("stroke","#2563eb");
      }
    },
    {
      title: "得出 ∠BDC＝39°",
      caption: "玫瑰紅 △BCD：25°、116°、39°。第一個所求角完成。",
      html: `
        <p>喺 △BCD 用三角形內角和：</p>
        <div class="tip gray">
          <div class="label"><i class="chip gr"></i>公式</div>
          <div>\\(\\angle BDC = 180^\\circ - 116^\\circ - 25^\\circ = 39^\\circ\\)</div>
        </div>
        <div class="tip purple">
          <div class="label"><i class="chip p"></i>為甚麼</div>
          <div>喺 △BCD，三隻頂角和為 180°；已知 \(\angle BCD=116^\circ\)、\(\angle CBD=25^\circ\)，剩下就係 \(\angle BDC\)。</div>
        </div>
        <div class="tip green">
          <div class="label"><i class="chip g"></i>小結</div>
          <div><strong>\\(\\angle BDC = 39^\\circ\\)</strong>（第一個答案）。</div>
        </div>
      `,
      apply() {
        show(["shadeBCD","arcCBD","labCBD","arcBCD","labBCD","arcBDC","labBDC"]);
        hl(["hlBD"]);
        el("CD").setAttribute("stroke-width","3");
        el("CD").setAttribute("stroke","#e11d48");
        el("BC").setAttribute("stroke","#e11d48");
        el("BC").setAttribute("stroke-width","3");
      }
    },
    {
      title: "同弓形圓周角",
      caption: "橙色弦 AB；淡黃為弓形；C、D 喺同一段圓周上。",
      html: `
        <p>下一步要搵 \\(\\angle ABE\\)，先準備 \\(\\angle ACB\\)。</p>
        <div class="tip yellow">
          <div class="label"><i class="chip y"></i>專有名詞：弦／弓形</div>
          <div><strong>弦</strong>：圓上兩點嘅連線（圖中橙色 AB）。<br/>
          <strong>弓形</strong>：弦同弧圍成嘅部分（淡黃）。</div>
        </div>
        <div class="tip yellow">
          <div class="label"><i class="chip y"></i>專有名詞：同弓形圓周角</div>
          <div>同一弧（或同一弓形）所對嘅圓周角相等。</div>
        </div>
        <div class="tip purple">
          <div class="label"><i class="chip p"></i>為甚麼</div>
          <div>\\(\\angle ACB\\) 同 \\(\\angle ADB\\) 都對住<strong>弧 AB</strong>，所以兩角相等。</div>
        </div>
      `,
      apply() {
        show(["shadeSegAB","arcADB","labADB","arcACB"]);
        hl(["hlAB_orange"]);
      }
    },
    {
      title: "求 ∠ACB＝58°",
      caption: "同弧 AB：∠ACB＝∠ADB＝58°。",
      html: `
        <div class="tip gray">
          <div class="label"><i class="chip gr"></i>公式</div>
          <div>\\(\\angle ACB = \\angle ADB = 58^\\circ\\)</div>
        </div>
        <div class="tip green">
          <div class="label"><i class="chip g"></i>小結</div>
          <div>因為 E 喺 AC 上，CE 沿住 CA，所以喺 △BCE 入面嘅 \\(\\angle BCE\\) 就係 \\(\\angle ACB\\)，即 \\(58^\\circ\\)。</div>
        </div>
      `,
      apply() {
        show(["shadeSegAB","arcADB","labADB","arcACB","labACB"]);
        hl(["hlAB_orange","hlBC"]);
      }
    },
    {
      title: "求 ∠CBE（△BCE）",
      caption: "紫色 △BCE：BC＝CE 等腰；三角為 58°、61°、61°。",
      html: `
        <p>△BCE 入面 \\(BC = CE\\)，所以係等腰，底角相等。</p>
        <div class="tip gray">
          <div class="label"><i class="chip gr"></i>公式</div>
          <div>\\(\\angle BCE = \\angle ACB = 58^\\circ\\)</div>
          <div>\\(\\angle CBE = \\angle CEB = \\dfrac{180^\\circ - 58^\\circ}{2} = 61^\\circ\\)</div>
        </div>
        <div class="tip green">
          <div class="label"><i class="chip g"></i>小結</div>
          <div>\\(\\angle CBE = 61^\\circ\\)。呢個角係 \\(\\angle ABC\\) 入面嘅一部分。</div>
        </div>
      `,
      apply() {
        show(["shadeBCE","ticksBCCE","arcACB","labACB","arcCBE","labCBE","arcCEB","labCEB"]);
        // hide AD/CD visually a bit
        ["AD","CD","BD"].forEach(id => el(id).classList.add("dim"));
        hl(["hlBC","hlCE","hlBE"]);
      }
    },
    {
      title: "求 ∠ABC＝83°",
      caption: "∠ABC＝∠ABD＋∠CBD＝58°＋25°＝83°。",
      html: `
        <p>喺點 B，\\(\\angle ABC\\) 由 \\(\\angle ABD\\) 同 \\(\\angle CBD\\) 拼成：</p>
        <div class="tip gray">
          <div class="label"><i class="chip gr"></i>公式</div>
          <div>\\(\\angle ABC = \\angle ABD + \\angle CBD = 58^\\circ + 25^\\circ = 83^\\circ\\)</div>
        </div>
        <div class="tip purple">
          <div class="label"><i class="chip p"></i>為甚麼</div>
          <div>BD 喺 ∠ABC 內部，把佢分成兩部分：對住 AD 嘅 58°，同對住 CD 嘅 25°。</div>
        </div>
      `,
      apply() {
        show(["arcABD","labABD","arcCBD","labCBD","arcABC","labABC"]);
        hl(["hlAB","hlBC","hlBD"]);
      }
    },
    {
      title: "∠ABE＝22°＋重點回顧",
      caption: "完成：∠BDC＝39°，∠ABE＝22°。",
      html: `
        <p>\\(\\angle ABE\\) 係 \\(\\angle ABC\\) 減去 \\(\\angle CBE\\)：</p>
        <div class="tip gray">
          <div class="label"><i class="chip gr"></i>公式</div>
          <div>\\(\\angle ABE = \\angle ABC - \\angle CBE = 83^\\circ - 61^\\circ = 22^\\circ\\)</div>
        </div>
        <div class="tip green">
          <div class="label"><i class="chip g"></i>答案</div>
          <div>
            <strong>\\(\\angle BDC = 39^\\circ\\)</strong><br/>
            <strong>\\(\\angle ABE = 22^\\circ\\)</strong>
          </div>
        </div>
        <div class="tip yellow">
          <div class="label"><i class="chip y"></i>重點回顧</div>
          <div>
            ① 等腰 △ABD → 底角 58° → \\(\\angle BAD=64^\\circ\\)<br/>
            ② 圓內接對角互補 → \\(\\angle BCD=116^\\circ\\) → \\(\\angle BDC=39^\\circ\\)<br/>
            ③ 同弧圓周角 → \\(\\angle ACB=58^\\circ\\)<br/>
            ④ 等腰 △BCE → \\(\\angle CBE=61^\\circ\\)<br/>
            ⑤ \\(\\angle ABC=83^\\circ\\) → \\(\\angle ABE=22^\\circ\\)
          </div>
        </div>
      `,
      apply() {
        show([
          "ticksABAD","ticksBCCE",
          "arcBDC","labBDC","arcABE","labABE",
          "arcCBD","labCBD","arcADB","labADB",
          "arcCBE","labCBE","arcABC","labABC"
        ]);
        hl(["hlBE","hlBD"]);
      }
    }
  ];

  const ALL_IDS = [
    "shadeABD","shadeBCD","shadeBCE","shadeSegAB",
    "ticksABAD","ticksBCCE",
    "arcADB","arcCBD","arcABD","arcBAD","arcBCD","arcBDC","arcACB","arcCBE","arcCEB","arcABC","arcABE",
    "labADB","labCBD","labABD","labBAD","labBCD","labBDC","labACB","labCBE","labCEB","labABC","labABE",
    "hlAB","hlAD","hlBC","hlCE","hlAB_orange","hlBD","hlBE"
  ];
  const HL = ["hlAB","hlAD","hlBC","hlCE","hlAB_orange","hlBD","hlBE"];
  const EDGE_RESET = ["AB","AD","BC","CD","AC","BD","BE"];

  function el(id) { return document.getElementById(id); }

  function resetViz() {
    ALL_IDS.forEach(id => {
      const n = el(id);
      if (n) n.classList.add("hide");
    });
    EDGE_RESET.forEach(id => {
      const n = el(id);
      if (!n) return;
      n.classList.remove("dim");
      n.setAttribute("stroke", "#1e293b");
      n.setAttribute("stroke-width", "2");
    });
    HL.forEach(id => el(id).classList.add("hide"));
  }

  function show(ids) {
    ids.forEach(id => {
      const n = el(id);
      if (n) n.classList.remove("hide");
    });
  }

  function hl(ids) {
    ids.forEach(id => {
      const n = el(id);
      if (n) n.classList.remove("hide");
    });
  }

  function renderKatex(root) {
    if (window.renderMathInElement) {
      renderMathInElement(root, {
        delimiters: [
          { left: "\\(", right: "\\)", display: false },
          { left: "\\[", right: "\\]", display: true }
        ],
        throwOnError: false
      });
    }
  }

  function go(n) {
    step = Math.max(1, Math.min(TOTAL, n));
    resetViz();
    const s = steps[step];
    el("lessonTitle").textContent = s.title;
    el("lessonBody").innerHTML = s.html;
    el("figCaption").textContent = s.caption;
    el("stepMeta").textContent = `步驟 ${step}／${TOTAL}　${s.title}`;
    s.apply();
    renderKatex(el("lessonBody"));

    // pills
    document.querySelectorAll(".pill").forEach((p, i) => {
      const k = i + 1;
      p.classList.toggle("active", k === step);
      p.classList.toggle("done", k < step);
      p.setAttribute("aria-current", k === step ? "step" : "false");
    });
    el("btnPrev").disabled = step === 1;
    el("btnNext").disabled = step === TOTAL;
    el("btnNext").textContent = step === TOTAL ? "完成" : "下一步 →";
  }

  function buildPills() {
    const box = el("pills");
    box.innerHTML = "";
    for (let i = 1; i <= TOTAL; i++) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "pill";
      b.textContent = String(i);
      b.setAttribute("aria-label", `步驟 ${i}`);
      b.addEventListener("click", () => go(i));
      box.appendChild(b);
    }
  }

  el("btnPrev").addEventListener("click", () => go(step - 1));
  el("btnNext").addEventListener("click", () => { if (step < TOTAL) go(step + 1); });
  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") go(step - 1);
    if (e.key === "ArrowRight") go(step + 1);
  });

  window.__katexReady = () => renderKatex(el("lessonBody"));

  buildPills();
  go(1);
})();
</script>
</body>
</html>
